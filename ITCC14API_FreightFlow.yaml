openapi: 3.0.3
info:
  title: Freight-Flow Logistics API - Bookings & Payments Module
  description: API endpoints for managing parcel bookings and associated payments. (Achilles' Branch)
  version: 1.0.0
servers:
  - url: https://api.freight-flow.com/v1
    description: Production server

tags:
  - name: Bookings
    description: Operations related to parcel bookings
  - name: Payments
    description: Operations related to booking payments

paths:
  /bookings:
    get:
      summary: Retrieve all bookings
      tags:
        - Bookings
      responses:
        '200':
          description: A list of bookings successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
    post:
      summary: Create a new booking
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /bookings/{booking_id}:
    get:
      summary: Retrieve a specific booking by ID
      tags:
        - Bookings
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Booking details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing booking
      tags:
        - Bookings
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
      responses:
        '200':
          description: Booking updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Cancel or delete a booking
      tags:
        - Bookings
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Booking deleted successfully
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments:
    get:
      summary: Retrieve all payments
      tags:
        - Payments
      responses:
        '200':
          description: A list of payments successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
    post:
      summary: Process a new payment
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '201':
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/{payment_id}:
    get:
      summary: Retrieve a specific payment by ID
      tags:
        - Payments
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Payment details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a payment status
      tags:
        - Payments
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '200':
          description: Payment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Void a payment
      tags:
        - Payments
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Payment voided successfully
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Booking:
      type: object
      properties:
        booking_id:
          type: integer
          example: 1001
        customer_id:
          type: integer
          example: 502
        branch_id:
          type: integer
          example: 12
        booking_date:
          type: string
          format: date-time
          example: "2026-11-03T10:00:00Z"
        booking_status:
          type: string
          example: "Pending"
          
    BookingInput:
      type: object
      required:
        - customer_id
        - branch_id
        - booking_status
      properties:
        customer_id:
          type: integer
          example: 502
        branch_id:
          type: integer
          example: 12
        booking_status:
          type: string
          example: "Pending"

    Payment:
      type: object
      properties:
        payment_id:
          type: integer
          example: 9001
        booking_id:
          type: integer
          example: 1001
        payment_method:
          type: string
          example: "Card"
        amount:
          type: number
          format: float
          example: 150.50
        payment_status:
          type: string
          example: "Paid"
        transaction_date:
          type: string
          format: date-time
          example: "2026-11-03T10:05:00Z"
          
    PaymentInput:
      type: object
      required:
        - booking_id
        - payment_method
        - amount
        - payment_status
      properties:
        booking_id:
          type: integer
          example: 1001
        payment_method:
          type: string
          example: "Card"
        amount:
          type: number
          format: float
          example: 150.50
        payment_status:
          type: string
          example: "Paid"

    Error:
      type: object
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: "Resource not found"