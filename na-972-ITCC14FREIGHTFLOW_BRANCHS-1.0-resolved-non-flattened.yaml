openapi: 3.0.0
info:
  title: Logistics Branch API
  description: API for managing branches in a logistics database
  version: "1.0"
servers:
- url: /
paths:
  /branches:
    get:
      summary: Retrieve all branches
      operationId: getAllBranches
      responses:
        "200":
          description: A list of branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
    post:
      summary: Create a new branch
      operationId: createBranch
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branch_name:
                  type: string
                address:
                  type: string
                contact_information:
                  type: string
        required: true
      responses:
        "201":
          description: Branch created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
  /branches/{branch_id}:
    get:
      summary: Retrieve a single branch by ID
      operationId: getBranchById
      parameters:
      - name: branch_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: A single branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
    put:
      summary: Update an existing branch
      operationId: updateBranch
      parameters:
      - name: branch_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branch_name:
                  type: string
                address:
                  type: string
                contact_information:
                  type: string
        required: true
      responses:
        "200":
          description: Branch updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
    delete:
      summary: Delete a branch
      operationId: deleteBranch
      parameters:
      - name: branch_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Branch deleted successfully
components:
  schemas:
    Branch:
      type: object
      properties:
        branch_id:
          type: integer
        branch_name:
          type: string
        address:
          type: string
        contact_information:
          type: string
      description: A branch in the logistics database
