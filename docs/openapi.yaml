# ==============================================================================
# Revision Summary (Addressing Instructor Feedback from Nov 10, 2026 & ERD/Relational Schema)
# ==============================================================================
# 1. Unified OpenAPI Specification & Removal of Wrapper Artifacts:
#    - Merged all modules (Customers, Branches, Staff, Bookings, Payments, Parcels,
#      Complaints, and DeliveryTeam) into one valid OpenAPI 3.0.3 file
#      (`ITCC14API_FreightFlow_Final.yaml`).
#    - Exported the Parcels and Complaints modules cleanly without `line` or
#      `content` source wrapper tags.
# 2. Standardized Servers, Authentication, Shared Schemas & Error Formats:
#    - Standardized server URLs (`https://api.freight-flow.com/v1` and
#      `http://localhost:3000/api/v1`), global JWT `bearerAuth` security, shared
#      pagination (`PageQuery`, `LimitQuery`, `{ data, page, limit, total }`),
#      and a single reusable `Error` schema across all 4xx responses (`400`, `401`,
#      `403`, `404`, `409`, `422`).
# 3. Complete Tags, Request/Response Examples & 4xx Responses Across All Modules:
#    - Added explicit tags, schema-matched request/response examples, and 4xx
#      responses with `$ref` error schemas on all endpoints—specifically filling
#      gaps in `Branches`, `Staff`, `GET /bookings`, and `GET /payments`.
# 4. Role-Based Access Control (Customer, Staff Specializations & Admin):
#    - Defined explicit permissions for `Admin`, `Staff` (`Manager`, `Courier`,
#      `Customer Service Representative`), and `Customer` (`Retail`, `E-Commerce`,
#      `Non-Profit`) in `info.description` and every operation's description,
#      enforced with `401 Unauthorized` and `403 Forbidden` responses.
# 5. Structured Complaint Resolution Workflow:
#    - Completed `PATCH /complaints/{complaint_id}` with the `ComplaintResolution`
#      schema (`staff_id`, `status` enum `[Pending, Investigating, Resolved, Dismissed]`,
#      and `outcome`) to support structured CSR assignment and resolution.
# 6. Parcel Status Lifecycle, Payment Verification & Cascade Rules:
#    - Documented sequential parcel status transitions (`Pending` -> `Booked` ->
#      `In Transit` -> `Out for Delivery` -> `Delivered` or `Failed`, blocking
#      regression from `Delivered` with `409 Conflict`).
#    - Documented 1:1 booking-to-payment verification (`Paid` payment transitions
#      booking from `Pending` to `Confirmed`; voiding reverts booking to `Pending`)
#      and cascade/restriction rules when deleting `Branches`, `Customers`, `Staff`,
#      `Bookings`, `Payments`, or `Parcels`.
# 7. EERD & Relational Diagram Alignment (Only Essential Missing Routes Added):
#    - Added `sender_id` and `receiver_id` FKs to `Parcel` (`Generates` / `Receives`),
#      `first_name`/`last_name` (`F_name`/`L_name`) to `RetailCustomerCreate`, and
#      aligned `contact_info` and column lengths (`varchar`, `decimal(5,2)`, `decimal(10,2)`).
#    - Added `/parcels/{parcel_id}/delivery-team` (`GET`, `PUT`, `DELETE`) to fulfill
#      the missing required action for the `Delivery team` associative table
#      (`staff_id`, `parcel_id`) linking `Courier` staff to parcels.
# ==============================================================================

openapi: 3.0.3
info:
  title: Freight-Flow Logistics API
  description: |
    REST API specification for the **Freight-Flow Express** logistics system, aligned with the Enhanced Entity-Relationship Diagram (EERD) and Relational Schema.

    ### Access Roles & Staff Specializations
    - **Admin**: Full unrestricted access across all branches, staff, customers, bookings, payments, parcels, delivery assignments, and complaints.
    - **Staff** (EERD overlapping specializations):
      - **Manager**: Manage branch operations, courier assignments, bookings, payments, parcels, and complaints.
      - **Courier (Delivery Team)**: View assigned parcels via the Delivery Team roster and update parcel delivery statuses (`In Transit`, `Out for Delivery`, `Delivered`, `Failed`).
      - **Customer Service Representative (CSR)**: View customer/parcel records and claim, investigate, and resolve customer complaints.
    - **Customer** (`Retail`, `E-Commerce`, `Non-Profit`): Manage own profile, create/view own bookings, track parcels where they are `sender_id` or `receiver_id`, view/pay for own bookings, and file/view own complaints.

    ### Core Business Logic, Status Lifecycles & Cascade Rules
    - **Customer Subtypes (Disjoint Specialization)**: Every customer must be `Retail`, `E-Commerce`, or `Non-Profit`, enforcing subtype-specific required attributes.
    - **Parcel Sender & Receiver**: Every parcel belongs to one `booking_id` and links two customers: `sender_id` (`Generates`) and `receiver_id` (`Receives`). Tracking numbers (`FF-TRK-XXXXXX`) are system-generated upon creation.
    - **Allowed Parcel Status Changes**: Parcels progress sequentially: `Pending` -> `Booked` -> `In Transit` -> `Out for Delivery` -> `Delivered` (or `Failed` during transit/delivery). Once a parcel reaches `Delivered`, its status cannot regress (`409 Conflict`).
    - **Payment Verification (1:1 Booking-to-Payment)**: Each booking generates at most one active payment (`409 Conflict` if a duplicate active payment is submitted). A booking remains `Pending` until its payment is verified as `Paid`, which transitions the booking to `Confirmed`.
    - **Delivery Team Assignment**: Associates a `Staff` member with role `Courier` to a `Parcel` (`422 ValidationError` if the assigned staff member is not a `Courier`).
    - **Referential Integrity & Cascade Rules on Cancel/Delete**:
      - **Branches**: Deletion is restricted (`409 Conflict`) if staff members or active bookings are assigned.
      - **Customers**: Deletion is restricted (`409 Conflict`) if active bookings, parcels, or unresolved complaints exist.
      - **Staff**: Deletion is restricted (`409 Conflict`) if assigned to active Delivery Team parcels or open complaints.
      - **Bookings**: Deleting or cancelling cascades to delete associated `Pending`/`Booked` parcels and voids the linked payment (`409 Conflict` if any parcel is already `In Transit` or `Delivered`).
      - **Payments**: Voiding a payment (`DELETE /payments/{payment_id}` or `payment_status: Voided`) reverts the associated booking status to `Pending`.
      - **Parcels**: Deleting a parcel removes its `DeliveryTeam` assignment without deleting the parent booking (`409 Conflict` if already `In Transit` or `Delivered`).
  version: 1.0.0
servers:
  - url: https://api.freight-flow.com/v1
    description: Production server
  - url: http://localhost:3000/api/v1
    description: Local development server
tags:
  - name: Customers
    description: Manage Retail, E-Commerce, and Non-Profit customer accounts
  - name: Branches
    description: Manage logistics branch locations
  - name: Staff
    description: Manage logistics staff (Managers, Couriers, Customer Service Representatives)
  - name: Bookings
    description: Operations related to customer parcel bookings
  - name: Payments
    description: Operations related to 1:1 booking payments and verification
  - name: Parcels
    description: Operations for managing parcels, sender/receiver links, and delivery statuses
  - name: DeliveryTeam
    description: Assign and manage Couriers (Delivery Team) handling specific parcels
  - name: Complaints
    description: Operations for logging, assigning to CSRs, and resolving customer complaints
security:
  - bearerAuth: []

paths:
  # ============================================================================
  # CUSTOMERS
  # ============================================================================
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      description: |
        Returns a paginated list of customers.
        - **Permissions**: `Admin`, `Manager`, `Customer Service Representative` (all customers); `Customer` (`403 Forbidden` — customers must use `GET /customers/{customer_id}` for their own profile).
      operationId: listCustomers
      parameters:
        - $ref: '#/components/parameters/AccountTypeQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Paginated list of customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
              example:
                data:
                  - customer_id: 502
                    name: "Maria Clara Santos"
                    first_name: "Maria Clara"
                    last_name: "Santos"
                    contact_info: "+63-917-555-0101"
                    account_type: "Retail"
                    address: "123 Hayes St, Cagayan de Oro City"
                    created_at: "2026-11-01T08:30:00Z"
                    updated_at: "2026-11-03T10:00:00Z"
                page: 1
                limit: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Customers]
      summary: Create a customer
      description: |
        Creates a new customer account (`Retail`, `E-Commerce`, or `Non-Profit`). Required subtype fields depend on `account_type`.
        - **Permissions**: `Admin`, `Staff` (`Manager`, `Customer Service Representative`), or customer self-registration.
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
            examples:
              retailCustomer:
                summary: Retail Customer
                value:
                  name: "Maria Clara Santos"
                  first_name: "Maria Clara"
                  last_name: "Santos"
                  contact_info: "+63-917-555-0101"
                  account_type: "Retail"
                  address: "123 Hayes St, Cagayan de Oro City"
              ecommerceCustomer:
                summary: E-Commerce Customer
                value:
                  name: "Kagay-an Tech Hub"
                  contact_info: "orders@kagayantech.ph"
                  account_type: "E-Commerce"
                  address: "Unit 4B Limketkai Center, Cagayan de Oro City"
                  store_name: "Kagay-an Tech Official"
                  business_registration_number: "DTI-2026-884120"
                  return_address_override: "Warehouse 2, Carmen, Cagayan de Oro City"
              nonProfitCustomer:
                summary: Non-Profit Customer
                value:
                  name: "Mindanao Relief Foundation"
                  contact_info: "logistics@mindanaorelief.org"
                  account_type: "Non-Profit"
                  address: "45 Corrales Ave, Cagayan de Oro City"
                  tax_exempt_status: true
                  charity_registration_number: "SEC-CN202400912"
                  donor_reference_codes: ["DON-2026-A1", "DON-2026-B4"]
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                customer_id: 502
                name: "Maria Clara Santos"
                first_name: "Maria Clara"
                last_name: "Santos"
                contact_info: "+63-917-555-0101"
                account_type: "Retail"
                address: "123 Hayes St, Cagayan de Oro City"
                created_at: "2026-11-01T08:30:00Z"
                updated_at: "2026-11-01T08:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /customers/{customer_id}:
    parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
    get:
      tags: [Customers]
      summary: Get a customer by ID
      description: |
        Retrieves a single customer profile including subtype attributes.
        - **Permissions**: `Admin`, `Staff` (any customer); `Customer` (own `customer_id` only, otherwise `403 Forbidden`).
      operationId: getCustomer
      responses:
        '200':
          description: The requested customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                customer_id: 502
                name: "Maria Clara Santos"
                first_name: "Maria Clara"
                last_name: "Santos"
                contact_info: "+63-917-555-0101"
                account_type: "Retail"
                address: "123 Hayes St, Cagayan de Oro City"
                created_at: "2026-11-01T08:30:00Z"
                updated_at: "2026-11-03T10:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Customers]
      summary: Replace a customer
      description: |
        Full replacement of a customer profile.
        - **Permissions**: `Admin`, `Manager` (any customer); `Customer` (own `customer_id` only).
      operationId: replaceCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
            example:
              name: "Maria Clara Santos"
              first_name: "Maria Clara"
              last_name: "Santos"
              contact_info: "+63-917-555-0199"
              account_type: "Retail"
              address: "789 Tiano Bros St, Cagayan de Oro City"
      responses:
        '200':
          description: Customer replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                customer_id: 502
                name: "Maria Clara Santos"
                first_name: "Maria Clara"
                last_name: "Santos"
                contact_info: "+63-917-555-0199"
                account_type: "Retail"
                address: "789 Tiano Bros St, Cagayan de Oro City"
                created_at: "2026-11-01T08:30:00Z"
                updated_at: "2026-11-04T09:15:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Customers]
      summary: Partially update a customer
      description: |
        Updates specific fields on a customer record. Submitting fields belonging to a different `account_type` returns `422 ValidationError`.
        - **Permissions**: `Admin`, `Manager` (any customer); `Customer` (own `customer_id` only).
      operationId: updateCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
            example:
              contact_info: "+63-917-555-0199"
              address: "789 Tiano Bros St, Cagayan de Oro City"
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                customer_id: 502
                name: "Maria Clara Santos"
                first_name: "Maria Clara"
                last_name: "Santos"
                contact_info: "+63-917-555-0199"
                account_type: "Retail"
                address: "789 Tiano Bros St, Cagayan de Oro City"
                created_at: "2026-11-01T08:30:00Z"
                updated_at: "2026-11-04T09:20:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Customers]
      summary: Delete a customer
      description: |
        Deletes a customer record. Returns `409 Conflict` if the customer has active bookings, in-transit parcels (as sender or receiver), or unresolved complaints.
        - **Permissions**: `Admin` only.
      operationId: deleteCustomer
      responses:
        '204':
          description: Customer deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ============================================================================
  # BRANCHES
  # ============================================================================
  /branches:
    get:
      tags: [Branches]
      summary: Retrieve all branches
      description: |
        Returns a paginated list of logistics branches.
        - **Permissions**: All authenticated users (`Admin`, `Staff`, `Customer`).
      operationId: getAllBranches
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Paginated list of branches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchList'
              example:
                data:
                  - branch_id: 12
                    branch_name: "Cagayan de Oro Main"
                    address: "Velez St, Cagayan de Oro City"
                    contact_info: "cdo.main@freight-flow.com"
                page: 1
                limit: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Branches]
      summary: Create a new branch
      description: |
        Registers a new logistics branch location.
        - **Permissions**: `Admin` only.
      operationId: createBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
            example:
              branch_name: "Cagayan de Oro Main"
              address: "Velez St, Cagayan de Oro City"
              contact_info: "cdo.main@freight-flow.com"
      responses:
        '201':
          description: Branch created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
              example:
                branch_id: 12
                branch_name: "Cagayan de Oro Main"
                address: "Velez St, Cagayan de Oro City"
                contact_info: "cdo.main@freight-flow.com"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /branches/{branch_id}:
    parameters:
      - $ref: '#/components/parameters/BranchIdPath'
    get:
      tags: [Branches]
      summary: Retrieve a single branch by ID
      description: |
        Retrieves branch details by ID.
        - **Permissions**: All authenticated users (`Admin`, `Staff`, `Customer`).
      operationId: getBranchById
      responses:
        '200':
          description: A single branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
              example:
                branch_id: 12
                branch_name: "Cagayan de Oro Main"
                address: "Velez St, Cagayan de Oro City"
                contact_info: "cdo.main@freight-flow.com"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Branches]
      summary: Update an existing branch
      description: |
        Updates branch name, address, or contact info.
        - **Permissions**: `Admin`, or `Manager` assigned to this `branch_id`.
      operationId: updateBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
            example:
              branch_name: "Cagayan de Oro Main Hub"
              address: "102 Velez St, Cagayan de Oro City"
              contact_info: "+63-88-856-1234"
      responses:
        '200':
          description: Branch updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
              example:
                branch_id: 12
                branch_name: "Cagayan de Oro Main Hub"
                address: "102 Velez St, Cagayan de Oro City"
                contact_info: "+63-88-856-1234"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Branches]
      summary: Delete a branch
      description: |
        Deletes a branch. Returns `409 Conflict` if staff members or active bookings are assigned to this branch.
        - **Permissions**: `Admin` only.
      operationId: deleteBranch
      responses:
        '204':
          description: Branch deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ============================================================================
  # STAFF
  # ============================================================================
  /staff:
    get:
      tags: [Staff]
      summary: Retrieve all staff members
      description: |
        Returns a paginated list of staff members, optionally filtered by `branch_id` or `role`.
        - **Permissions**: `Admin`, `Manager`.
      operationId: getAllStaff
      parameters:
        - name: branch_id
          in: query
          required: false
          description: Filter staff by assigned branch ID
          schema:
            type: integer
            minimum: 1
        - name: role
          in: query
          required: false
          description: Filter staff by EERD role specialization
          schema:
            $ref: '#/components/schemas/StaffRole'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Paginated list of staff members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffList'
              example:
                data:
                  - staff_id: 5
                    branch_id: 12
                    name: "Joshua Reyes"
                    role: "Courier"
                    permission_level: "Staff"
                page: 1
                limit: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Staff]
      summary: Create a new staff member
      description: |
        Creates a new staff member assigned to a branch with an EERD specialization role (`Manager`, `Courier`, or `Customer Service Representative`).
        - **Permissions**: `Admin` only.
      operationId: createStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffInput'
            example:
              branch_id: 12
              name: "Joshua Reyes"
              role: "Courier"
              permission_level: "Staff"
      responses:
        '201':
          description: Staff member created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
              example:
                staff_id: 5
                branch_id: 12
                name: "Joshua Reyes"
                role: "Courier"
                permission_level: "Staff"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /staff/{staff_id}:
    parameters:
      - $ref: '#/components/parameters/StaffIdPath'
    get:
      tags: [Staff]
      summary: Retrieve a single staff member by ID
      description: |
        Retrieves staff member details by ID.
        - **Permissions**: `Admin`, `Manager`, or the authenticated `Staff` member viewing their own record.
      operationId: getStaffById
      responses:
        '200':
          description: A single staff member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
              example:
                staff_id: 5
                branch_id: 12
                name: "Joshua Reyes"
                role: "Courier"
                permission_level: "Staff"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Staff]
      summary: Update an existing staff member
      description: |
        Updates a staff member's branch, name, role, or permission level.
        - **Permissions**: `Admin` only.
      operationId: updateStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffInput'
            example:
              branch_id: 12
              name: "Joshua Reyes"
              role: "Manager"
              permission_level: "Admin"
      responses:
        '200':
          description: Staff member updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
              example:
                staff_id: 5
                branch_id: 12
                name: "Joshua Reyes"
                role: "Manager"
                permission_level: "Admin"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Staff]
      summary: Delete a staff member
      description: |
        Deletes a staff member. Returns `409 Conflict` if the staff member is currently assigned to active Delivery Team parcels or open complaints.
        - **Permissions**: `Admin` only.
      operationId: deleteStaff
      responses:
        '204':
          description: Staff member deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ============================================================================
  # BOOKINGS
  # ============================================================================
  /bookings:
    get:
      tags: [Bookings]
      summary: Retrieve bookings
      description: |
        Returns a paginated list of bookings.
        - **Permissions**: `Admin`, `Staff` (all bookings, filterable by `customer_id`, `branch_id`, or `booking_status`); `Customer` (automatically scoped to their own `customer_id`; querying another `customer_id` returns `403 Forbidden`).
      operationId: getAllBookings
      parameters:
        - name: customer_id
          in: query
          required: false
          description: Filter bookings by customer ID
          schema:
            type: integer
            minimum: 1
        - name: branch_id
          in: query
          required: false
          description: Filter bookings by originating branch ID
          schema:
            type: integer
            minimum: 1
        - name: booking_status
          in: query
          required: false
          description: Filter bookings by status
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Paginated list of bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
              example:
                data:
                  - booking_id: 1001
                    customer_id: 502
                    branch_id: 12
                    booking_date: "2026-11-03T10:00:00Z"
                    booking_status: "Pending"
                page: 1
                limit: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Bookings]
      summary: Create a new booking
      description: |
        Places a new booking originating at a specified `branch_id`. Initial `booking_status` defaults to `Pending` until payment is verified as `Paid`.
        - **Permissions**: `Admin`, `Staff` (`Manager`, `Customer Service Representative`), or `Customer` (must match own `customer_id`).
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
            example:
              customer_id: 502
              branch_id: 12
              booking_status: "Pending"
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                booking_id: 1001
                customer_id: 502
                branch_id: 12
                booking_date: "2026-11-03T10:00:00Z"
                booking_status: "Pending"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /bookings/{booking_id}:
    parameters:
      - $ref: '#/components/parameters/BookingIdPath'
    get:
      tags: [Bookings]
      summary: Retrieve a specific booking by ID
      description: |
        Retrieves details for a single booking.
        - **Permissions**: `Admin`, `Staff` (any booking); `Customer` (own booking only).
      operationId: getBookingById
      responses:
        '200':
          description: Booking details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                booking_id: 1001
                customer_id: 502
                branch_id: 12
                booking_date: "2026-11-03T10:00:00Z"
                booking_status: "Confirmed"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Bookings]
      summary: Replace an existing booking
      description: |
        Full replacement of a booking record.
        - **Permissions**: `Admin`, `Manager`.
      operationId: updateBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
            example:
              customer_id: 502
              branch_id: 12
              booking_status: "Confirmed"
      responses:
        '200':
          description: Booking updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                booking_id: 1001
                customer_id: 502
                branch_id: 12
                booking_date: "2026-11-03T10:00:00Z"
                booking_status: "Confirmed"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Bookings]
      summary: Partially update a booking
      description: |
        Updates booking branch or status (e.g., cancelling a `Pending` booking).
        - **Permissions**: `Admin`, `Manager` (any booking); `Customer` (may cancel own `Pending` booking only).
      operationId: patchBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingUpdate'
            example:
              booking_status: "Cancelled"
      responses:
        '200':
          description: Booking updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                booking_id: 1001
                customer_id: 502
                branch_id: 12
                booking_date: "2026-11-03T10:00:00Z"
                booking_status: "Cancelled"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Bookings]
      summary: Cancel or delete a booking
      description: |
        Cancelling/deleting a booking cascades to delete its `Pending`/`Booked` parcels and voids its associated payment. Returns `409 Conflict` if any parcel in the booking is already `In Transit` or `Delivered`.
        - **Permissions**: `Admin`, `Manager`.
      operationId: deleteBooking
      responses:
        '204':
          description: Booking deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ============================================================================
  # PAYMENTS
  # ============================================================================
  /payments:
    get:
      tags: [Payments]
      summary: Retrieve payments
      description: |
        Returns a paginated list of payments.
        - **Permissions**: `Admin`, `Manager` (all payments); `Customer` (payments linked to their own bookings only; querying another customer's `booking_id` returns `403 Forbidden`).
      operationId: getAllPayments
      parameters:
        - name: booking_id
          in: query
          required: false
          description: Filter payment by associated booking ID (1:1 relationship)
          schema:
            type: integer
            minimum: 1
        - name: payment_status
          in: query
          required: false
          description: Filter by payment status
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Paginated list of payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
              example:
                data:
                  - payment_id: 9001
                    booking_id: 1001
                    payment_method: "GCash"
                    amount: 150.50
                    payment_status: "Paid"
                    transaction_date: "2026-11-03T10:05:00Z"
                page: 1
                limit: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Payments]
      summary: Process a new payment
      description: |
        Records a payment for a booking (1:1 relationship). Returns `409 Conflict` if the booking already has a non-voided payment or is `Cancelled`. Setting `payment_status` to `Paid` automatically updates the linked booking to `Confirmed`.
        - **Permissions**: `Admin`, `Manager`, or `Customer` (for own booking).
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
            example:
              booking_id: 1001
              payment_method: "GCash"
              amount: 150.50
              payment_status: "Paid"
      responses:
        '201':
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                payment_id: 9001
                booking_id: 1001
                payment_method: "GCash"
                amount: 150.50
                payment_status: "Paid"
                transaction_date: "2026-11-03T10:05:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /payments/{payment_id}:
    parameters:
      - $ref: '#/components/parameters/PaymentIdPath'
    get:
      tags: [Payments]
      summary: Retrieve a specific payment by ID
      description: |
        Retrieves payment details by ID.
        - **Permissions**: `Admin`, `Manager` (any payment); `Customer` (own booking's payment only).
      operationId: getPaymentById
      responses:
        '200':
          description: Payment details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                payment_id: 9001
                booking_id: 1001
                payment_method: "GCash"
                amount: 150.50
                payment_status: "Paid"
                transaction_date: "2026-11-03T10:05:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Payments]
      summary: Replace a payment record
      description: |
        Full update of a payment record.
        - **Permissions**: `Admin`, `Manager`.
      operationId: updatePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
            example:
              booking_id: 1001
              payment_method: "Card"
              amount: 150.50
              payment_status: "Paid"
      responses:
        '200':
          description: Payment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                payment_id: 9001
                booking_id: 1001
                payment_method: "Card"
                amount: 150.50
                payment_status: "Paid"
                transaction_date: "2026-11-03T10:05:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Payments]
      summary: Partially update payment status or method
      description: |
        Updates `payment_status` or `payment_method`. Transitioning to `Paid` updates the linked booking to `Confirmed`; transitioning to `Voided` reverts the linked booking to `Pending`.
        - **Permissions**: `Admin`, `Manager`.
      operationId: patchPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentUpdate'
            example:
              payment_status: "Paid"
      responses:
        '200':
          description: Payment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                payment_id: 9001
                booking_id: 1001
                payment_method: "GCash"
                amount: 150.50
                payment_status: "Paid"
                transaction_date: "2026-11-03T10:05:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Payments]
      summary: Void a payment
      description: |
        Voids a payment and reverts the associated booking status to `Pending`.
        - **Permissions**: `Admin`, `Manager`.
      operationId: deletePayment
      responses:
        '204':
          description: Payment voided successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # PARCELS
  # ============================================================================
  /parcels:
    get:
      tags: [Parcels]
      summary: Retrieve parcels
      description: |
        Returns a paginated list of parcels, linking `booking_id`, `sender_id`, and `receiver_id`.
        - **Permissions**: `Admin`, `Staff` (all parcels, or `Courier` filtered to assigned parcels); `Customer` (automatically scoped to parcels where they are `sender_id` or `receiver_id`).
      operationId: getAllParcels
      parameters:
        - name: booking_id
          in: query
          required: false
          description: Filter parcels belonging to a specific booking
          schema:
            type: integer
            minimum: 1
        - name: sender_id
          in: query
          required: false
          description: Filter parcels by sender customer ID
          schema:
            type: integer
            minimum: 1
        - name: receiver_id
          in: query
          required: false
          description: Filter parcels by receiver customer ID
          schema:
            type: integer
            minimum: 1
        - name: current_status
          in: query
          required: false
          description: Filter parcels by their current delivery status
          schema:
            $ref: '#/components/schemas/ParcelStatus'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Paginated list of parcels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelList'
              example:
                data:
                  - parcel_id: 1
                    booking_id: 1001
                    sender_id: 502
                    receiver_id: 509
                    tracking_number: "FF-TRK-983421"
                    weight: 2.50
                    item_name: "Electronics - Mechanical Keyboard"
                    current_status: "In Transit"
                page: 1
                limit: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Parcels]
      summary: Create a new parcel entry
      description: |
        Registers a parcel under an existing `booking_id` with `sender_id` and `receiver_id`. Generates a unique `tracking_number` (`FF-TRK-XXXXXX`) automatically.
        - **Permissions**: `Admin`, `Staff` (`Manager`, `Customer Service Representative`), or `Customer` (for own booking).
      operationId: createParcel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParcelCreate'
            example:
              booking_id: 1001
              sender_id: 502
              receiver_id: 509
              weight: 2.50
              item_name: "Electronics - Mechanical Keyboard"
              current_status: "Booked"
      responses:
        '201':
          description: Parcel successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
              example:
                parcel_id: 1
                booking_id: 1001
                sender_id: 502
                receiver_id: 509
                tracking_number: "FF-TRK-983421"
                weight: 2.50
                item_name: "Electronics - Mechanical Keyboard"
                current_status: "Booked"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /parcels/{parcel_id}:
    parameters:
      - $ref: '#/components/parameters/ParcelIdPath'
    get:
      tags: [Parcels]
      summary: Get parcel by ID
      description: |
        Retrieves parcel details including `tracking_number`, `sender_id`, `receiver_id`, and `current_status`.
        - **Permissions**: `Admin`, `Staff` (any parcel); `Customer` (must be `sender_id` or `receiver_id`).
      operationId: getParcelById
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
              example:
                parcel_id: 1
                booking_id: 1001
                sender_id: 502
                receiver_id: 509
                tracking_number: "FF-TRK-983421"
                weight: 2.50
                item_name: "Electronics - Mechanical Keyboard"
                current_status: "In Transit"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Parcels]
      summary: Replace an existing parcel
      description: |
        Full update of parcel details. Returns `409 Conflict` if attempting to regress a `Delivered` parcel's status.
        - **Permissions**: `Admin`, `Manager`.
      operationId: updateParcel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParcelCreate'
            example:
              booking_id: 1001
              sender_id: 502
              receiver_id: 509
              weight: 2.75
              item_name: "Electronics - Mechanical Keyboard & Wrist Rest"
              current_status: "In Transit"
      responses:
        '200':
          description: Parcel successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
              example:
                parcel_id: 1
                booking_id: 1001
                sender_id: 502
                receiver_id: 509
                tracking_number: "FF-TRK-983421"
                weight: 2.75
                item_name: "Electronics - Mechanical Keyboard & Wrist Rest"
                current_status: "In Transit"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Parcels]
      summary: Update parcel delivery status or attributes
      description: |
        Partially updates a parcel (primarily used by Couriers and Managers to advance `current_status` through `Booked` -> `In Transit` -> `Out for Delivery` -> `Delivered`/`Failed`). Returns `409 Conflict` if attempting to regress from `Delivered`.
        - **Permissions**: `Admin`, `Manager`, or assigned `Courier`.
      operationId: patchParcel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParcelUpdate'
            example:
              current_status: "Delivered"
      responses:
        '200':
          description: Parcel status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
              example:
                parcel_id: 1
                booking_id: 1001
                sender_id: 502
                receiver_id: 509
                tracking_number: "FF-TRK-983421"
                weight: 2.50
                item_name: "Electronics - Mechanical Keyboard"
                current_status: "Delivered"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Parcels]
      summary: Delete a parcel
      description: |
        Deletes a parcel and removes its Delivery Team assignment without deleting the parent booking. Returns `409 Conflict` if the parcel is already `In Transit` or `Delivered`.
        - **Permissions**: `Admin`, `Manager`.
      operationId: deleteParcel
      responses:
        '204':
          description: Parcel successfully deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

