          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # COMPLAINTS
  # ============================================================================
  /complaints:
    get:
      tags: [Complaints]
      summary: Retrieve complaints
      description: |
        Returns a paginated list of customer complaints.
        - **Permissions**: `Admin`, `Manager`, `Customer Service Representative` (all complaints); `Customer` (automatically scoped to their own filed complaints).
      operationId: getAllComplaints
      parameters:
        - name: category
          in: query
          required: false
          description: Filter complaints by category
          schema:
            $ref: '#/components/schemas/ComplaintCategory'
        - name: status
          in: query
          required: false
          description: Filter complaints by resolution status
          schema:
            $ref: '#/components/schemas/ComplaintStatus'
        - name: staff_id
          in: query
          required: false
          description: Filter complaints handled by a specific CSR staff ID
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Paginated list of complaints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintList'
              example:
                data:
                  - complaint_id: 501
                    customer_id: 502
                    parcel_id: 1
                    staff_id: 8
                    description: "Package arrived with damaged outer box."
                    category: "Delivery Issue"
                    status: "Resolved"
                    outcome: "Replacement shipment approved and shipping fee refunded."
                    created_at: "2026-11-03T11:30:00Z"
                page: 1
                limit: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Complaints]
      summary: Submit a new complaint
      description: |
        Logs a new complaint filed by `customer_id` referencing `parcel_id`. Initial `status` is set to `Pending` and `staff_id` is `null` until claimed by a Customer Service Representative.
        - **Permissions**: `Customer` (for own `customer_id` and linked parcel), `Admin`, `Customer Service Representative`.
      operationId: createComplaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintCreate'
            example:
              customer_id: 502
              parcel_id: 1
              description: "Package arrived with damaged outer box."
              category: "Delivery Issue"
      responses:
        '201':
          description: Complaint successfully logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
              example:
                complaint_id: 501
                customer_id: 502
                parcel_id: 1
                staff_id: null
                description: "Package arrived with damaged outer box."
                category: "Delivery Issue"
                status: "Pending"
                outcome: null
                created_at: "2026-11-03T11:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /complaints/{complaint_id}:
    parameters:
      - $ref: '#/components/parameters/ComplaintIdPath'
    get:
      tags: [Complaints]
      summary: Get complaint by ID
      description: |
        Retrieves complaint details including assigned Customer Service Representative (`staff_id`), `status`, and resolution `outcome`.
        - **Permissions**: `Admin`, `Staff` (any complaint); `Customer` (own complaint only).
      operationId: getComplaintById
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
              example:
                complaint_id: 501
                customer_id: 502
                parcel_id: 1
                staff_id: 8
                description: "Package arrived with damaged outer box."
                category: "Delivery Issue"
                status: "Resolved"
                outcome: "Replacement shipment approved and shipping fee refunded."
                created_at: "2026-11-03T11:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Complaints]
      summary: Assign, investigate, or resolve a complaint
      description: |
        Updates the handling Customer Service Representative (`staff_id`), structured `status`, and resolution `outcome` of an existing complaint.
        - **Permissions**: `Admin`, `Manager`, `Customer Service Representative`.
      operationId: resolveComplaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintResolution'
            example:
              staff_id: 8
              status: "Resolved"
              outcome: "Replacement shipment approved and shipping fee refunded."
      responses:
        '200':
          description: Complaint successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
              example:
                complaint_id: 501
                customer_id: 502
                parcel_id: 1
                staff_id: 8
                description: "Package arrived with damaged outer box."
                category: "Delivery Issue"
                status: "Resolved"
                outcome: "Replacement shipment approved and shipping fee refunded."
                created_at: "2026-11-03T11:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Complaints]
      summary: Delete a complaint record
      description: |
        Deletes an invalid or duplicate complaint record.
        - **Permissions**: `Admin` only.
      operationId: deleteComplaint
      responses:
        '204':
          description: Complaint successfully deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

# ==============================================================================
# COMPONENTS
# ==============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued at authentication. Claims include user ID, role (`Admin`, `Staff`, `Customer`), and staff specialization (`Manager`, `Courier`, `Customer Service Representative`).

  parameters:
    CustomerIdPath:
      name: customer_id
      in: path
      required: true
      description: Unique ID of the customer
      schema:
        type: integer
        minimum: 1
        example: 502
    BranchIdPath:
      name: branch_id
      in: path
      required: true
      description: Unique ID of the branch
      schema:
        type: integer
        minimum: 1
        example: 12
    StaffIdPath:
      name: staff_id
      in: path
      required: true
      description: Unique ID of the staff member
      schema:
        type: integer
        minimum: 1
        example: 5
    BookingIdPath:
      name: booking_id
      in: path
      required: true
      description: Unique ID of the booking
      schema:
        type: integer
        minimum: 1
        example: 1001
    PaymentIdPath:
      name: payment_id
      in: path
      required: true
      description: Unique ID of the payment
      schema:
        type: integer
        minimum: 1
        example: 9001
    ParcelIdPath:
      name: parcel_id
      in: path
      required: true
      description: Unique ID of the parcel
      schema:
        type: integer
        minimum: 1
        example: 1
    ComplaintIdPath:
      name: complaint_id
      in: path
      required: true
      description: Unique ID of the complaint
      schema:
        type: integer
        minimum: 1
        example: 501
    AccountTypeQuery:
      name: account_type
      in: query
      required: false
      description: Filter customers by account type
      schema:
        $ref: '#/components/schemas/AccountType'
    SearchQuery:
      name: search
      in: query
      required: false
      description: Case-insensitive name search
      schema:
        type: string
        example: santos
    PageQuery:
      name: page
      in: query
      required: false
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Malformed request (invalid JSON syntax, invalid path ID, or bad query parameter)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BAD_REQUEST
            message: Invalid input syntax or query parameter.
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentication token is missing or invalid.
    Forbidden:
      description: Authenticated user lacks required role or resource ownership
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: You do not have permission to perform this action on the requested resource.
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: The requested resource was not found.
    Conflict:
      description: Business rule violation, duplicate record, or referential integrity constraint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CONFLICT
            message: Action cannot be completed due to referential integrity or lifecycle constraints.
    ValidationError:
      description: Request is well-formed JSON but fails schema or domain validation rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Validation failed.
            details:
              - field: sender_id
                issue: sender_id must reference an existing customer.

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Validation failed.
        details:
          type: array
          description: Field-level validation errors, when applicable
          items:
            type: object
            required: [field, issue]
            properties:
              field:
                type: string
                example: store_name
              issue:
                type: string
                example: store_name is required for E-Commerce accounts.

    # --------------------------------------------------------------------------
    # Customer Schemas (EERD Disjoint Specialization + Relational Schema)
    # --------------------------------------------------------------------------
    AccountType:
      type: string
      description: Customer category from EERD disjoint specialization. Determines required subtype attributes.
      enum: [Retail, E-Commerce, Non-Profit]
      example: Retail

    CustomerBase:
      type: object
      required: [name, contact_info, account_type, address]
      properties:
        name:
          type: string
          maxLength: 100
          example: "Maria Clara Santos"
        contact_info:
          type: string
          maxLength: 150
          description: Primary phone number or email address (`contact_info` / `contact_no.`)
          example: "+63-917-555-0101"
        account_type:
          $ref: '#/components/schemas/AccountType'
        address:
          type: string
          maxLength: 200
          description: Primary residential or organizational street address
          example: "123 Hayes St, Cagayan de Oro City"

    RetailCustomerCreate:
      allOf:
        - $ref: '#/components/schemas/CustomerBase'
        - type: object
          required: [first_name, last_name]
          properties:
            account_type:
              type: string
              enum: [Retail]
              example: Retail
            first_name:
              type: string
              maxLength: 50
              description: EERD Retail subtype `F_name`
              example: "Maria Clara"
            last_name:
              type: string
              maxLength: 50
              description: EERD Retail subtype `L_name`
              example: "Santos"

    EcommerceCustomerCreate:
      allOf:
        - $ref: '#/components/schemas/CustomerBase'
        - type: object
          required: [store_name, business_registration_number]
          properties:
            account_type:
              type: string
              enum: [E-Commerce]
              example: E-Commerce
            store_name:
              type: string
              maxLength: 100
              example: "Kagay-an Tech Official"
            business_registration_number:
              type: string
              maxLength: 50
              example: "DTI-2026-884120"
            return_address_override:
              type: string
              maxLength: 200
              nullable: true
              example: "Warehouse 2, Carmen, Cagayan de Oro City"

    NonProfitCustomerCreate:
      allOf:
        - $ref: '#/components/schemas/CustomerBase'
        - type: object
          required: [tax_exempt_status, charity_registration_number]
          properties:
            account_type:
              type: string
              enum: [Non-Profit]
              example: Non-Profit
            tax_exempt_status:
              type: boolean
              example: true
            charity_registration_number:
              type: string
              maxLength: 50
              example: "SEC-CN202400912"
            donor_reference_codes:
              type: array
              items:
                type: string
                maxLength: 50
              example: ["DON-2026-A1", "DON-2026-B4"]

    CustomerCreate:
      oneOf:
        - $ref: '#/components/schemas/RetailCustomerCreate'
        - $ref: '#/components/schemas/EcommerceCustomerCreate'
        - $ref: '#/components/schemas/NonProfitCustomerCreate'
      discriminator:
        propertyName: account_type
        mapping:
          Retail: '#/components/schemas/RetailCustomerCreate'
          E-Commerce: '#/components/schemas/EcommerceCustomerCreate'
          Non-Profit: '#/components/schemas/NonProfitCustomerCreate'

    CustomerUpdate:
      type: object
      minProperties: 1
      description: Partial update payload. Only fields valid for the customer's existing `account_type` are accepted.
      properties:
        name:
          type: string
          maxLength: 100
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        contact_info:
          type: string
          maxLength: 150
        address:
          type: string
          maxLength: 200
        store_name:
          type: string
          maxLength: 100
        business_registration_number:
          type: string
          maxLength: 50
        return_address_override:
          type: string
          maxLength: 200
          nullable: true
        tax_exempt_status:
          type: boolean
        charity_registration_number:
          type: string
          maxLength: 50
        donor_reference_codes:
          type: array
          items:
            type: string
            maxLength: 50

    RecordMetadata:
      type: object
      required: [customer_id, created_at, updated_at]
      properties:
        customer_id:
          type: integer
          readOnly: true
          example: 502
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-11-01T08:30:00Z"
        updated_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-11-03T10:00:00Z"

    RetailCustomer:
      allOf:
        - $ref: '#/components/schemas/RecordMetadata'
        - $ref: '#/components/schemas/RetailCustomerCreate'

    EcommerceCustomer:
      allOf:
        - $ref: '#/components/schemas/RecordMetadata'
        - $ref: '#/components/schemas/EcommerceCustomerCreate'

    NonProfitCustomer:
      allOf:
        - $ref: '#/components/schemas/RecordMetadata'
        - $ref: '#/components/schemas/NonProfitCustomerCreate'

    Customer:
      oneOf:
        - $ref: '#/components/schemas/RetailCustomer'
        - $ref: '#/components/schemas/EcommerceCustomer'
        - $ref: '#/components/schemas/NonProfitCustomer'
      discriminator:
        propertyName: account_type
        mapping:
          Retail: '#/components/schemas/RetailCustomer'
          E-Commerce: '#/components/schemas/EcommerceCustomer'
          Non-Profit: '#/components/schemas/NonProfitCustomer'

    CustomerList:
      type: object
      required: [data, page, limit, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 42

    # --------------------------------------------------------------------------
    # Branch Schemas
    # --------------------------------------------------------------------------
    BranchInput:
      type: object
      required: [branch_name, address, contact_info]
      properties:
        branch_name:
          type: string
          maxLength: 50
          example: "Cagayan de Oro Main"
        address:
          type: string
          maxLength: 200
          example: "Velez St, Cagayan de Oro City"
        contact_info:
          type: string
          maxLength: 50
          example: "cdo.main@freight-flow.com"

    Branch:
      allOf:
        - type: object
          required: [branch_id]
          properties:
            branch_id:
              type: integer
              readOnly: true
              example: 12
        - $ref: '#/components/schemas/BranchInput'

    BranchList:
      type: object
      required: [data, page, limit, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 5

    # --------------------------------------------------------------------------
    # Staff Schemas (EERD Specialization: Manager, Courier, CSR)
    # --------------------------------------------------------------------------
    StaffRole:
      type: string
      description: EERD Staff specialization role
      enum: [Manager, Courier, Customer Service Representative]
      example: Courier

    PermissionLevel:
      type: string
      description: System access privilege tier
      enum: [Admin, Staff]
      example: Staff

    StaffInput:
      type: object
      required: [branch_id, name, role, permission_level]
      properties:
        branch_id:
          type: integer
          minimum: 1
          example: 12
        name:
          type: string
          maxLength: 100
          example: "Joshua Reyes"
        role:
          $ref: '#/components/schemas/StaffRole'
        permission_level:
          $ref: '#/components/schemas/PermissionLevel'

    Staff:
      allOf:
        - type: object
          required: [staff_id]
          properties:
            staff_id:
              type: integer
              readOnly: true
              example: 5
        - $ref: '#/components/schemas/StaffInput'

    StaffList:
      type: object
      required: [data, page, limit, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Staff'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 18

    # --------------------------------------------------------------------------
    # Booking Schemas
    # --------------------------------------------------------------------------
    BookingStatus:
      type: string
      description: Lifecycle status of a customer booking
      enum: [Pending, Confirmed, Cancelled]
      example: Pending

    BookingInput:
      type: object
      required: [customer_id, branch_id]
      properties:
        customer_id:
          type: integer
          minimum: 1
          example: 502
        branch_id:
          type: integer
          minimum: 1
          example: 12
        booking_status:
          $ref: '#/components/schemas/BookingStatus'

    BookingUpdate:
      type: object
      minProperties: 1
      properties:
        branch_id:
          type: integer
          minimum: 1
          example: 14
        booking_status:
          $ref: '#/components/schemas/BookingStatus'

    Booking:
      allOf:
        - type: object
          required: [booking_id, booking_date, booking_status]
          properties:
            booking_id:
              type: integer
              readOnly: true
              example: 1001
            booking_date:
              type: string
              format: date-time
              readOnly: true
              example: "2026-11-03T10:00:00Z"
        - $ref: '#/components/schemas/BookingInput'

    BookingList:
      type: object
      required: [data, page, limit, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 125

    # --------------------------------------------------------------------------
    # Payment Schemas (1:1 with Booking)
    # --------------------------------------------------------------------------
    PaymentMethod:
      type: string
      enum: [Cash, Card, GCash, Bank Transfer]
      example: GCash

    PaymentStatus:
      type: string
      enum: [Pending, Paid, Failed, Voided]
      example: Paid

    PaymentInput:
      type: object
      required: [booking_id, payment_method, amount, payment_status]
      properties:
        booking_id:
          type: integer
          minimum: 1
          description: Unique booking ID (1:1 relationship with Booking)
          example: 1001
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          type: number
          format: double
          minimum: 0.01
          maximum: 99999999.99
          description: Payment amount (`decimal(10,2)`)
          example: 150.50
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'

    PaymentUpdate:
      type: object
      minProperties: 1
      properties:
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'

    Payment:
      allOf:
        - type: object
          required: [payment_id, transaction_date]
          properties:
            payment_id:
              type: integer
              readOnly: true
              example: 9001
            transaction_date:
              type: string
              format: date-time
              readOnly: true
              example: "2026-11-03T10:05:00Z"
        - $ref: '#/components/schemas/PaymentInput'

    PaymentList:
      type: object
      required: [data, page, limit, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 118

    # --------------------------------------------------------------------------
    # Parcel & DeliveryTeam Schemas
    # --------------------------------------------------------------------------
    ParcelStatus:
      type: string
      description: Sequential parcel delivery status
      enum: [Pending, Booked, In Transit, Out for Delivery, Delivered, Failed]
      example: In Transit

    ParcelCreate:
      type: object
      required: [booking_id, sender_id, receiver_id, weight, item_name]
      properties:
        booking_id:
          type: integer
          minimum: 1
          example: 1001
        sender_id:
          type: integer
          minimum: 1
          description: Customer ID of the parcel sender (EERD `Generates` relationship)
          example: 502
        receiver_id:
          type: integer
          minimum: 1
          description: Customer ID of the parcel recipient (EERD `Receives` relationship)
          example: 509
        weight:
          type: number
          format: double
          minimum: 0.01
          maximum: 999.99
          description: Parcel weight in kg (`decimal(5,2)`)
          example: 2.50
        item_name:
          type: string
          maxLength: 100
          example: "Electronics - Mechanical Keyboard"
        current_status:
          $ref: '#/components/schemas/ParcelStatus'

    ParcelUpdate:
      type: object
      minProperties: 1
      properties:
        weight:
          type: number
          format: double
          minimum: 0.01
          maximum: 999.99
        item_name:
          type: string
          maxLength: 100
        current_status:
          $ref: '#/components/schemas/ParcelStatus'

    Parcel:
      allOf:
        - type: object
          required: [parcel_id, tracking_number, current_status]
          properties:
            parcel_id:
              type: integer
              readOnly: true
              example: 1
            tracking_number:
              type: string
              maxLength: 50
              readOnly: true
              description: System-generated unique tracking code (`[UK]`)
              example: "FF-TRK-983421"
        - $ref: '#/components/schemas/ParcelCreate'

    ParcelList:
      type: object
      required: [data, page, limit, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Parcel'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 310

    DeliveryTeamInput:
      type: object
      required: [staff_id]
      properties:
        staff_id:
          type: integer
          minimum: 1
          description: Staff ID of a user with role `Courier`
          example: 5

    DeliveryTeamAssignment:
      type: object
      required: [staff_id, parcel_id]
      properties:
        staff_id:
          type: integer
          description: Assigned Courier's `staff_id` (PK/FK)
          example: 5
        parcel_id:
          type: integer
          description: Assigned Parcel's `parcel_id` (FK)
          example: 1

    # --------------------------------------------------------------------------
    # Complaint Schemas
    # --------------------------------------------------------------------------
    ComplaintCategory:
      type: string
      enum: [Delivery Issue, Seller Dispute, Billing Issue, Damaged Item]
      example: Delivery Issue

    ComplaintStatus:
      type: string
      enum: [Pending, Investigating, Resolved, Dismissed]
      example: Pending

    ComplaintCreate:
      type: object
      required: [customer_id, parcel_id, description, category]
      properties:
        customer_id:
          type: integer
          minimum: 1
          description: Customer filing the complaint (EERD `files` relationship)
          example: 502
        parcel_id:
          type: integer
          minimum: 1
          description: Referenced parcel ID (EERD `references` relationship)
          example: 1
        description:
          type: string
          maxLength: 2000
          example: "Package arrived with damaged outer box."
        category:
          $ref: '#/components/schemas/ComplaintCategory'

    ComplaintResolution:
      type: object
      minProperties: 1
      properties:
        staff_id:
          type: integer
          minimum: 1
          nullable: true
          description: Staff ID of the Customer Service Representative handling the complaint (EERD `Handles` relationship)
          example: 8
        status:
          $ref: '#/components/schemas/ComplaintStatus'
        outcome:
          type: string
          maxLength: 1000
          nullable: true
          example: "Replacement shipment approved and shipping fee refunded."

    Complaint:
      allOf:
        - type: object
          required: [complaint_id, status, created_at]
          properties:
            complaint_id:
              type: integer
              readOnly: true
              example: 501
            created_at:
              type: string
              format: date-time
              readOnly: true
              example: "2026-11-03T12:00:00Z"
        - $ref: '#/components/schemas/ComplaintCreate'
        - $ref: '#/components/schemas/ComplaintResolution'

    ComplaintList:
      type: object
      required: [data, page, limit, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Complaint'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 14
