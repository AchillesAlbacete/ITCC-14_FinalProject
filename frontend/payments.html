<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payments • Freight-Flow Express</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/ff.css" />
  <script src="js/api.js"></script>
</head>

<body class="text-slate-900 antialiased">

  <div id="ff-sidebar"></div>

  <div class="lg:pl-64 min-h-screen flex flex-col">
    <div id="ff-topbar"></div>

    <main class="flex-1 px-4 sm:px-8 py-8 max-w-[1280px] w-full mx-auto">

      <div class="mb-8">
        <h1 class="text-3xl font-extrabold tracking-tight">Every payment, accounted for.</h1>
        <p class="text-slate-500 mt-1">One booking. One payment. A clear record from collection to void.</p>
      </div>

      <!-- Summary -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="card p-5"><div class="text-xs font-medium text-slate-500 uppercase tracking-wide">Collected (Paid)</div><div id="sumPaid" class="mt-1 text-2xl font-extrabold font-mono">—</div></div>
        <div class="card p-5"><div class="text-xs font-medium text-slate-500 uppercase tracking-wide">Pending</div><div id="sumPending" class="mt-1 text-2xl font-extrabold font-mono">—</div></div>
        <div class="card p-5"><div class="text-xs font-medium text-slate-500 uppercase tracking-wide">Failed</div><div id="sumFailed" class="mt-1 text-2xl font-extrabold font-mono">—</div></div>
        <div class="card p-5"><div class="text-xs font-medium text-slate-500 uppercase tracking-wide">Voided</div><div id="sumVoided" class="mt-1 text-2xl font-extrabold font-mono">—</div></div>
      </div>

      <!-- Ledger -->
      <section class="card overflow-hidden" aria-labelledby="ledgerTitle">
        <div class="p-5 sm:p-6 flex flex-wrap items-center justify-between gap-4 border-b border-line">
          <h2 id="ledgerTitle" class="text-lg font-bold">Payments Ledger</h2>

          <div class="flex flex-wrap items-center gap-3">
            <div class="relative">
              <label for="search" class="sr-only">Search by payment_id or booking_id</label>
              <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              <input id="search" type="search" class="field pl-9 w-64" placeholder="Search payment_id or booking_id" autocomplete="off" />
            </div>
            <div>
              <label for="statusFilter" class="sr-only">Filter by payment status</label>
              <select id="statusFilter" class="field w-44">
                <option value="All">All statuses</option>
                <option>Paid</option>
                <option>Pending</option>
                <option>Failed</option>
                <option>Voided</option>
              </select>
            </div>
            <button type="button" id="refresh" class="btn btn-outline btn-sm" aria-label="Refresh ledger"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="ledger w-full min-w-[860px]">
            <thead>
              <tr>
                <th scope="col">payment_id</th>
                <th scope="col">booking_id</th>
                <th scope="col">payment_method</th>
                <th scope="col" class="!text-right">amount</th>
                <th scope="col">payment_status</th>
                <th scope="col">transaction_date</th>
                <th scope="col" class="!text-right">Action</th>
              </tr>
            </thead>
            <tbody id="ledgerBody"></tbody>
          </table>
        </div>

        <div class="px-6 py-3 text-xs text-slate-500 border-t border-line flex justify-between">
          <span id="count">&nbsp;</span>
          <span class="font-mono">GET /payments</span>
        </div>
      </section>
    </main>
  </div>

  <script>
    FF.mountShell({ page: 'payments.html', roles: ['Manager'] });
    const $ = FF.$;

    const PAY_BADGE = { Paid: 'emerald', Pending: 'amber', Failed: 'rose', Voided: 'rose' };
    const METHOD_ICON = { GCash: 'smartphone', Card: 'credit-card', 'Bank Transfer': 'landmark', Cash: 'banknote' };

    let payments = [];       // every payment (joined with booking_status), newest first
    let flashId = null;      // row to highlight after a change
    let loadFailed = false;

    // ---------- Load the full ledger (GET /payments pages of 100) ----------
    async function loadPayments() {
      $('ledgerBody').innerHTML = Array.from({ length: 5 }, () =>
        '<tr><td colspan="7"><div class="skeleton h-5 w-full"></div></td></tr>').join('');
      try {
        const all = [];
        for (let page = 1; page <= 10; page += 1) {
          const res = await FF.apiFetch('/payments', { query: { include: 'details', limit: 100, page }, silent: page > 1 });
          all.push(...res.data);
          if (all.length >= res.total) break;
        }
        payments = all;
        loadFailed = false;
      } catch (err) {
        loadFailed = true;
      }
      render();
    }

    // ---------- Render ----------
    function render() {
      const q = $('search').value.trim().replace(/^#/, '').toLowerCase();
      const status = $('statusFilter').value;
      const rows = payments.filter((p) =>
        (status === 'All' || p.payment_status === status) &&
        (!q || String(p.payment_id).includes(q) || String(p.booking_id).includes(q)));

      const body = $('ledgerBody');
      if (loadFailed) {
        body.innerHTML = '<tr><td colspan="7" class="empty">Couldn\'t load payments. Check that the server is running, then press refresh.</td></tr>';
      } else if (!rows.length) {
        body.innerHTML = `<tr><td colspan="7" class="empty">${payments.length ? 'No payments match your search.' : 'No payments recorded yet.'}</td></tr>`;
      } else {
        body.innerHTML = rows.map((p) => `
          <tr data-id="${p.payment_id}" class="${p.payment_id === flashId ? 'flash' : ''}">
            <td class="mono font-medium">${p.payment_id}</td>
            <td>
              <div class="flex items-center gap-2">
                <span class="mono">#${p.booking_id}</span>
                ${FF.badge(p.booking_status || 'Pending').replace('class="badge', 'title="Linked booking status" class="badge')}
              </div>
            </td>
            <td><span class="inline-flex items-center gap-2"><i data-lucide="${METHOD_ICON[p.payment_method] || 'wallet'}" class="w-4 h-4 text-slate-400"></i>${FF.esc(p.payment_method)}</span></td>
            <td class="text-right mono font-medium ${p.payment_status === 'Voided' ? 'line-through text-slate-400' : ''}">${FF.peso(p.amount)}</td>
            <td><span class="badge badge-${PAY_BADGE[p.payment_status] || 'slate'}">${FF.esc(p.payment_status)}</span></td>
            <td class="text-slate-600 whitespace-nowrap">${FF.date(p.transaction_date)}</td>
            <td class="text-right">
              ${p.payment_status === 'Paid'
                ? `<button type="button" class="btn btn-danger-outline btn-sm" data-void="${p.payment_id}"><i data-lucide="ban" class="w-3.5 h-3.5"></i>Void Payment</button>`
                : '<span class="text-slate-400 text-sm">—</span>'}
            </td>
          </tr>`).join('');
      }
      flashId = null;

      $('count').textContent = loadFailed ? '' : `Showing ${rows.length} of ${payments.length} payments`;
      renderSummary();
      FF.icons();
    }

    function renderSummary() {
      const count = (s) => payments.filter((p) => p.payment_status === s).length;
      const paid = payments.filter((p) => p.payment_status === 'Paid').reduce((t, p) => t + p.amount, 0);
      $('sumPaid').textContent = loadFailed ? '—' : FF.peso(paid);
      $('sumPending').textContent = loadFailed ? '—' : count('Pending');
      $('sumFailed').textContent = loadFailed ? '—' : count('Failed');
      $('sumVoided').textContent = loadFailed ? '—' : count('Voided');
    }

    // ---------- Void flow ----------
    function openVoidModal(payment, trigger) {
      const ref = '#' + payment.booking_id;
      const m = FF.openModal({
        html: `
          <div class="flex items-start gap-4">
            <div class="w-11 h-11 rounded-xl bg-rose-50 text-rose-600 grid place-items-center shrink-0"><i data-lucide="octagon-alert" class="w-5 h-5"></i></div>
            <div>
              <h2 class="text-lg font-bold">Void payment <span class="mono">#${payment.payment_id}</span>?</h2>
              <p class="text-sm text-slate-600 mt-2 leading-relaxed">Voiding this payment changes payment_status from Paid to Voided and automatically reverts the linked booking (${ref}) back to Pending.</p>
            </div>
          </div>
          <div class="mt-5 rounded-xl bg-slate-50 border border-line p-4 text-sm space-y-2">
            <div class="flex items-center justify-between"><span class="text-slate-500 mono text-xs">payment_status</span><span class="flex items-center gap-2"><span class="badge badge-emerald">Paid</span><i data-lucide="arrow-right" class="w-3.5 h-3.5 text-slate-400"></i><span class="badge badge-rose">Voided</span></span></div>
            <div class="flex items-center justify-between"><span class="text-slate-500 mono text-xs">booking_status (${ref})</span><span class="flex items-center gap-2"><span class="badge badge-emerald">Confirmed</span><i data-lucide="arrow-right" class="w-3.5 h-3.5 text-slate-400"></i><span class="badge badge-amber">Pending</span></span></div>
          </div>
          <div class="mt-6 flex justify-end gap-3">
            <button type="button" class="btn btn-outline" data-close data-autofocus>Keep payment</button>
            <button type="button" id="confirmVoid" class="btn btn-danger"><i data-lucide="ban" class="w-4 h-4"></i> Void payment</button>
          </div>`,
      });
      const btn = m.panel.querySelector('#confirmVoid');
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Voiding…';
        try {
          // PATCH /payments/{id}/void: payment -> Voided, linked booking -> Pending
          await FF.api.patch(`/payments/${payment.payment_id}/void`);
          const fresh = await FF.apiFetch(`/payments/${payment.payment_id}`, { query: { include: 'details' } });
          payments = payments.map((p) => (p.payment_id === fresh.payment_id ? fresh : p));
          flashId = fresh.payment_id;
          m.close(true);
          render();
          FF.toast(`Booking #${fresh.booking_id} reverted to ${fresh.booking_status}.`, 'warning', { title: `Payment #${fresh.payment_id} voided` });
        } catch (err) {
          m.close(false);
          loadPayments(); // 409 / 404: resync with the server's truth
        }
      });
    }

    $('ledgerBody').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-void]');
      if (!btn) return;
      const payment = payments.find((p) => p.payment_id === Number(btn.dataset.void));
      if (payment && payment.payment_status === 'Paid') openVoidModal(payment, btn);
    });
    $('search').addEventListener('input', render);
    $('statusFilter').addEventListener('change', render);
    $('refresh').addEventListener('click', loadPayments);

    loadPayments();
  </script>
</body>
</html>
