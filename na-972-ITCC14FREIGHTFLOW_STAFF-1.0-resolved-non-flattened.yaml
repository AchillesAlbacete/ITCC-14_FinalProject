openapi: 3.0.0
info:
  title: Logistics Staff API
  description: API for managing staff in the logistics database project
  version: "1.0"
servers:
- url: /
paths:
  /staff:
    get:
      summary: Retrieve all staff members
      operationId: getAllStaff
      responses:
        "200":
          description: A list of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Staff"
    post:
      summary: Create a new staff member
      operationId: createStaff
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branch_id:
                  type: integer
                name:
                  type: string
                role:
                  type: string
                permission_level:
                  type: string
        required: true
      responses:
        "201":
          description: Staff member created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
  /staff/{staff_id}:
    get:
      summary: Retrieve a single staff member by ID
      operationId: getStaffById
      parameters:
      - name: staff_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: A single staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
    put:
      summary: Update an existing staff member
      operationId: updateStaff
      parameters:
      - name: staff_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branch_id:
                  type: integer
                name:
                  type: string
                role:
                  type: string
                permission_level:
                  type: string
        required: true
      responses:
        "200":
          description: Staff member updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
    delete:
      summary: Delete a staff member
      operationId: deleteStaff
      parameters:
      - name: staff_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Staff member deleted successfully
components:
  schemas:
    Staff:
      type: object
      properties:
        staff_id:
          type: integer
        branch_id:
          type: integer
        name:
          type: string
        role:
          type: string
        permission_level:
          type: string
      description: A staff member in the logistics database
